<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2050" width="1500" height="2050" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="1500" height="2050" fill="#fff"/><rect x="300.0" y="30" width="640" height="110" rx="8" fill="#eef1f5" stroke="#1a1a1a" stroke-width="2"/><text x="620.0" y="81.1875" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Decision point (every 4 h)</text><text x="620.0" y="108.7625" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Each ICU patient not yet septic</text><circle cx="266.0" cy="85.0" r="21" fill="#1a1a1a"/><text x="266.0" y="92.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">1</text><polyline points="620,140 620,190" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="300.0" y="190" width="640" height="125" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="620.0" y="238.22500000000002" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Time-gated data snapshot</text><text x="620.0" y="265.8" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Only data charted and stored before now</text><text x="620.0" y="286.725" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Notes lagged 6 h; label-defining data excluded</text><circle cx="266.0" cy="252.5" r="21" fill="#1a1a1a"/><text x="266.0" y="259.5" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">2</text><polyline points="620,315 620,365" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="300.0" y="365" width="640" height="125" rx="8" fill="#fff" stroke="#008300" stroke-width="2"/><text x="620.0" y="413.225" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Validated risk engine scores risk</text><text x="620.0" y="440.8" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Calibrated 12-h sepsis risk from a locally</text><text x="620.0" y="461.725" text-anchor="middle" font-size="15.5" fill="#1a1a1a">validated model (gradient boosting here)</text><circle cx="266.0" cy="427.5" r="21" fill="#1a1a1a"/><text x="266.0" y="434.5" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">3</text><polyline points="620,490 620,555" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><polygon points="620,555.0 800.0,640 620,725.0 440.0,640" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="620" y="636" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Risk ≥ threshold?</text><text x="620" y="660" text-anchor="middle" font-size="16" fill="#1a1a1a">chosen operating point</text><polyline points="800,640 1150,640" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="820" y="628.0" text-anchor="start" font-size="17" font-style="italic" fill="#1a1a1a">No</text><rect x="1150" y="565" width="320" height="150" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="1310.0" y="625.7249999999999" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">No alert</text><text x="1310.0" y="653.2999999999998" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Continue monitoring</text><text x="1310.0" y="674.2249999999999" text-anchor="middle" font-size="15.5" fill="#1a1a1a">at next decision point</text><polyline points="1310,565 1310,85 940.0,85" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ahg)"/><text x="1322" y="360.0" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">next cycle</text><polyline points="620,725 620,820" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="632" y="780.0" text-anchor="start" font-size="17" font-style="italic" fill="#1a1a1a">Yes</text><rect x="300.0" y="820" width="640" height="150" rx="8" fill="#fff" stroke="#6a3fb5" stroke-width="2"/><text x="620.0" y="870.2624999999999" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Evidence agent investigates</text><text x="620.0" y="897.8374999999999" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Locally served LLM calls tools: vitals,</text><text x="620.0" y="918.7624999999999" text-anchor="middle" font-size="15.5" fill="#1a1a1a">labs, urine output, notes</text><text x="620.0" y="939.6874999999999" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Summarises evidence; lists missing data</text><circle cx="266.0" cy="895.0" r="21" fill="#1a1a1a"/><text x="266.0" y="902.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">4</text><polyline points="620,970 620,1030" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="300.0" y="1030" width="640" height="125" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="620.0" y="1078.225" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Verification</text><text x="620.0" y="1105.8" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Each cited number checked</text><text x="620.0" y="1126.725" text-anchor="middle" font-size="15.5" fill="#1a1a1a">against retrieved tool outputs</text><circle cx="266.0" cy="1092.5" r="21" fill="#1a1a1a"/><text x="266.0" y="1099.5" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">5</text><rect x="1060" y="1032" width="410" height="120" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="1265.0" y="1077.725" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Unverified statement</text><text x="1265.0" y="1105.3" text-anchor="middle" font-size="15.5" fill="#1a1a1a">flagged or removed</text><text x="1265.0" y="1126.225" text-anchor="middle" font-size="15.5" fill="#1a1a1a">before display</text><polyline points="940.0,1092 1060,1092" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ah)"/><text x="950.0" y="1082.0" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">fails</text><polyline points="620,1155 620,1215" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="632" y="1193.0" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">passes</text><rect x="300.0" y="1215" width="640" height="150" rx="8" fill="#fdf3ea" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="620.0" y="1265.2625" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Alert to clinician</text><text x="620.0" y="1292.8375" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Risk from the validated engine</text><text x="620.0" y="1313.7625" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Cited evidence with times</text><text x="620.0" y="1334.6875000000002" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Missing data to check</text><circle cx="266.0" cy="1290.0" r="21" fill="#1a1a1a"/><text x="266.0" y="1297.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">6</text><polyline points="620,1365 620,1450" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><polygon points="620,1450.0 810.0,1530 620,1610.0 430.0,1530" fill="#fff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9,6"/><text x="620" y="1526" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Clinician decides</text><text x="620" y="1550" text-anchor="middle" font-size="16" fill="#1a1a1a">decision authority</text><rect x="150" y="1680" width="300" height="120" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="300.0" y="1725.725" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Confirm</text><text x="300.0" y="1753.3" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Sepsis work-up per</text><text x="300.0" y="1774.225" text-anchor="middle" font-size="15.5" fill="#1a1a1a">local guideline</text><rect x="455" y="1680" width="300" height="120" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="605.0" y="1725.725" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Defer</text><text x="605.0" y="1753.3" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Reassess at next</text><text x="605.0" y="1774.225" text-anchor="middle" font-size="15.5" fill="#1a1a1a">decision point</text><rect x="760" y="1680" width="300" height="120" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="910.0" y="1736.1875" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Dismiss</text><text x="910.0" y="1763.7625" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Reason recorded</text><polyline points="430,1530 300,1530 300,1680" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><polyline points="620,1610 605,1680" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><polyline points="810,1530 910,1530 910,1680" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="1880" width="1410" height="120" rx="8" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="765.0" y="1925.725" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Logging and monitoring (all steps)</text><text x="765.0" y="1953.3" text-anchor="middle" font-size="15.5" fill="#1a1a1a">Every snapshot, risk, tool call, alert and clinician response is logged for audit;</text><text x="765.0" y="1974.225" text-anchor="middle" font-size="15.5" fill="#1a1a1a">responses and alert burden feed recalibration of the risk model</text><polyline points="300,1800 300,1880" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ahg)"/><polyline points="605,1800 605,1880" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ahg)"/><polyline points="910,1800 910,1880" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#ahg)"/><rect x="1150" y="1240" width="70" height="30" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="1230" y="1262" font-size="15.5" fill="#1a1a1a">Tested in this study</text><rect x="1150" y="1290" width="70" height="30" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="9,6"/><text x="1230" y="1312" font-size="15.5" fill="#1a1a1a">Proposed</text></svg>
